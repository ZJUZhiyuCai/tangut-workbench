name: Checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,cldf]"
      - run: tangut validate
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: tangut import-unicode && git diff --exit-code -- data/characters.jsonl
      - run: tangut export-cldf --output build/cldf
      - run: tangut build --output build/site
      - run: node --check web/app.js
      - run: python scripts/release.py
